- name: Zircuit JSON-RPC API
  description: >-
    Standard Ethereum JSON-RPC 2.0 interface to the Zircuit L2 network (HTTP and WebSocket) for reading
    chain state and submitting transactions. Mainnet is chain ID 48900; the Garfield testnet is chain
    ID 48898. EVM-compatible, so the full eth_* / net_* / web3_* method set applies. DRPC additionally
    offers paid high-performance node access with debug traces.
