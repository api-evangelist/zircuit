name: Zircuit
description: >-
  Zircuit is a zero-knowledge (zk) rollup Layer 2 blockchain and secure onchain
  finance platform. The network is fully EVM-compatible and OP-Stack based,
  letting developers deploy standard Solidity smart contracts (via Foundry and
  the usual Ethereum tooling) while settling to Ethereum with zk validity
  proofs. Zircuit exposes standard Ethereum JSON-RPC endpoints for mainnet
  (chain ID 48900) and the Garfield testnet (chain ID 48898), a canonical
  L1<>L2 bridge, a relayer service (EIP-7702 gasless relaying), a transaction
  simulation surface, and the GUD Trading Engine — a REST API that aggregates
  cross-chain liquidity to return best-execution quotes and signable
  transaction data. On top of the chain, Zircuit Finance and the Liquidity Hub
  offer institutional-grade yield and LST/LRT staking. Backed by Pantera
  Capital; the network and contracts have been audited by six independent
  security firms and run a bug-bounty program.
